name: Gold Market Scanner

on:
  schedule:
    # Active window: 10:00 AM - 00:00 AM Tehran (UTC+3:30 = 06:30 - 20:30 UTC), Mon-Fri
    - cron: '30 6 * * 1-5'               # 10:00 AM Tehran -> Wakeup + scan
    - cron: '35,40,45,50,55 6 * * 1-5'   # 10:05 - 10:25 AM Tehran -> Scan
    - cron: '*/5 7-19 * * 1-5'           # 10:30 AM - 23:25 PM Tehran -> Scan every 5 min
    - cron: '0,5,10,15,20,25 20 * * 1-5' # 23:30 - 23:55 PM Tehran -> Scan
    - cron: '30 20 * * 1-5'              # 00:00 AM Tehran -> Goodnight / Sleep

  # Triggered by cron-job.org every 5 minutes (auto_cron) OR manually via GitHub UI!
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        default: 'manual_scan'
        options:
          - manual_scan
          - auto_cron
          - wakeup
          - sleep

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore scanner state (dedup & cooldown)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Run Market Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "auto_cron" ]; then
              python scan_once.py --auto
            elif [ "${{ inputs.mode }}" = "wakeup" ]; then
              python scan_once.py --wakeup
            elif [ "${{ inputs.mode }}" = "sleep" ]; then
              python scan_once.py --sleep
            else
              python scan_once.py --manual
            fi
          elif [ "${{ github.event.schedule }}" = "30 6 * * 1-5" ]; then
            python scan_once.py --wakeup
          elif [ "${{ github.event.schedule }}" = "30 20 * * 1-5" ]; then
            python scan_once.py --sleep
          else
            python scan_once.py
          fi

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
